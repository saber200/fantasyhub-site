<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>幻想枢纽 FantasyHub</title>
    <meta name="description" content="幻想枢纽（FantasyHub），专为掌机玩家而生的 Windows 全屏启动器。" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <main>
      <img class="mark" src="favicon.png" alt="" />
      <p class="product-en">FantasyHub</p>
      <h1>幻想枢纽</h1>
      <p class="slogan">专为掌机玩家而生</p>
      <a class="download" id="download" href="#">下载 Beta版 安装包</a>
      <p class="version" id="version">版本 0.1.13 · Windows 64 位</p>
      <section class="cards" aria-label="功能">
        <article>
          <h2>游戏库</h2>
          <p>扫描 Steam 和 Epic游戏库，支持通过Steam App ID下载封面。</p>
        </article>
        <article>
          <h2>软件库</h2>
          <p>整理已经安装的软件。</p>
        </article>
        <article>
          <h2>文件管理</h2>
          <p>
            完全使用手柄管理你的文件。<br />
            更贴合掌机使用。
          </p>
        </article>
        <article>
          <h2>极致性能</h2>
          <p>
            超小包体，极致性能。内存占用率只有可怜的 0%
          </p>
        </article>
      </section>
      <p class="note">
        默认安装到 <code>C:\Users\用户名\AppData\Local\FantasyHub</code>。安装包未签名，Windows 可能会出现 SmartScreen 提示。
      </p>
    </main>
    <script src="site.js"></script>
  </body>
</html>
